<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sign Up | MoneyFlow</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="auth-wrapper">
    <div class="glass-card auth-card">
      <div class="auth-logo">
        <div class="brand-icon" style="width: 48px; height: 48px; font-size: 24px; margin-bottom: 16px;">M</div>
        <h1 class="text-2xl font-bold">Create Account</h1>
        <p class="text-secondary text-sm mt-2">Start taking control of your finances.</p>
      </div>

      <div id="signup-error" class="auth-error"></div>
      <div id="signup-success" class="auth-error" style="background-color: rgba(16, 185, 129, 0.1); color: var(--income); display: none;"></div>

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="name" class="form-input" required placeholder="John Doe">
        </div>
        
        <div class="form-group">
          <label class="form-label">Email address</label>
          <input type="email" id="email" class="form-input" required placeholder="you@example.com">
        </div>
        
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" required minlength="6" placeholder="••••••••">
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" id="confirm-password" class="form-input" required minlength="6" placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary btn-block mt-6" id="btn-signup">
          Sign Up
        </button>
      </form>

      <div class="text-center mt-6 text-sm text-secondary">
        Already have an account? <a href="login.html" class="font-semibold text-primary">Log in</a>
      </div>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const btn = document.getElementById('btn-signup');
      const errorDiv = document.getElementById('signup-error');
      const successDiv = document.getElementById('signup-success');

      if (password !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match.';
        errorDiv.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account...';
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      const { data, error } = await Auth.signUp(email, password, name);

      if (error) {
        errorDiv.textContent = error.message;
        errorDiv.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign Up';
      } else {
        successDiv.textContent = 'Account created successfully! Redirecting...';
        successDiv.style.display = 'block';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);
      }
    });
  </script>
</body>
</html>
